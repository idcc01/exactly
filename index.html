<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信授权登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: #f5f7fa; display: grid; place-items: center; height: 100vh; color: #2c3e50; }
        .card { background: #fff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h2 { margin-bottom: 10px; color: #3498db; }
        p { color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="card">
        <h2>微信授权登录中</h2>
        <p>请稍候，正在安全跳转...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-sha256@3.2.0/dist/sha256.min.js"></script>
    <script>
        // ======================================
        // 配置（你自己填）
        // ======================================
        const APPID = "wxde2ad02f02cb0df5";
        const APPSECRET = "f27a1e32177f425fe8c940d******"; // 你真实的
        const SHARED_SECRET = "changeit-bridge-secret";
        const TARGET_HOST = "https://ipp.noteflow.me";

        (async () => {
            const params = new URLSearchParams(location.search);
            const code = params.get("code");
            const site = params.get("site") || "";
            const invite = params.get("invite") || "";

            // 无 code 则去微信授权
            if (!code) {
                const redirectUri = encodeURIComponent("https://zt.xiaoyuwangluo.vip/?" + params.toString());
                location.replace(
                    `https://open.weixin.qq.com/connect/oauth2/authorize?appid=${APPID}&redirect_uri=${redirectUri}&response_type=code&scope=snsapi_userinfo&state=1#wechat_redirect`
                );
                return;
            }

            try {
                // ======================================
                // 1. 拿 access_token + openid + unionid
                // ======================================
                const tokenRes = await fetch(
                    `https://api.weixin.qq.com/sns/oauth2/access_token?appid=${APPID}&secret=${APPSECRET}&code=${code}&grant_type=authorization_code`
                ).then(r => r.json());

                const { access_token, openid, unionid } = tokenRes;

                // ======================================
                // 2. 拿用户信息
                // ======================================
                const userRes = await fetch(
                    `https://api.weixin.qq.com/sns/userinfo?access_token=${access_token}&openid=${openid}&lang=zh_CN`
                ).then(r => r.json());

                const nickname = userRes.nickname || "";
                const avatar = userRes.headimgurl || "";

                // ======================================
                // 3. 组装签名字段（完全按 Claude）
                // ======================================
                const ts = String(Math.floor(Date.now() / 1000));
                const fields = {
                    unionid: unionid || "",
                    openid: openid,
                    nickname: nickname,
                    avatar: avatar,
                    ts: ts,
                    site: site,
                    invite: invite,
                };

                // 过滤空值 + 排序
                const filtered = Object.entries(fields).filter(([, v]) => v !== "");
                filtered.sort(([a], [b]) => a.localeCompare(b));

                // 生成 base 串
                const signBase = filtered.map(([k, v]) => `${k}=${v}`).join("&");

                // HMAC-SHA256
                function hmacSha256(message, secret) {
                    const sha256 = sha256_hmac;
                    return sha256(message, secret);
                }

                const sign = hmacSha256(signBase, SHARED_SECRET).toLowerCase();

                // ======================================
                // 4. 跳转到主站 /
                // ======================================
                const finalParams = new URLSearchParams({ ...fields, sign });
                location.replace(`${TARGET_HOST}/?${finalParams.toString()}`);

            } catch (e) {
                console.error(e);
                alert("授权失败：" + e.message);
            }
        })();
    </script>
</body>
</html>
